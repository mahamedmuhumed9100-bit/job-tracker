databases:
  - name: jobtracker-db
    plan: free
    databaseName: jobtracker
    user: jobtracker

services:
  - type: web
    name: jobtracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtracker-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
